name: AquaTruck Android CI

on:
  push:
    branches:
      - main
      - feat/offline-first-location-sync
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aquatruck-android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (Android SDK 36.1)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK 36.1
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36.1 build-tools;36.1.0'

      # The project build.gradle.kts explicitly references this local debug keystore.
      # Generate it on the ephemeral GitHub runner; do not commit it to the repository.
      - name: Generate temporary debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # The private Firebase web client ID is not committed to this repository.
      # Add a build-only placeholder when google-services.json is unavailable.
      # This makes the CI APK compile; Google Sign-In still needs a real client ID.
      - name: Provide CI-only Google Sign-In resource
        run: |
          if [ ! -f app/google-services.json ]; then
            mkdir -p app/src/debug/res/values
            cat > app/src/debug/res/values/google_services_ci.xml <<'EOF'
          <resources>
              <string name="default_web_client_id" translatable="false">ci-placeholder.apps.googleusercontent.com</string>
          </resources>
          EOF
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Run unit tests and build debug APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: aquatrack-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aquatrack-unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14
