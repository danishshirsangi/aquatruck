name: AquaTruck Android CI

on:
  push:
    branches:
      - main
      - feat/offline-first-location-sync
      - feat/multi-tenant-fleet-management
  pull_request:
    branches:
      - main
      - feat/offline-first-location-sync
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aquatruck-android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (Android SDK 36.1)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK 36.1
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36.1 build-tools;36.1.0'

      - name: Restore Firebase configuration
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::Missing repository secret GOOGLE_SERVICES_JSON_BASE64. Add the base64-encoded google-services.json in Settings > Secrets and variables > Actions."
            exit 1
          fi

          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("app/google-services.json").read_text())
          clients = config.get("client", [])
          package_names = {
              client.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for client in clients
          }
          if "com.aistudio.aquatrack.wtrsrv" not in package_names:
              raise SystemExit("Firebase config package name does not match the Android applicationId.")
          print("Firebase config restored and Android package name validated.")
          PY

      # Use one persistent signing key so Google Sign-In SHA-1 stays stable across builds.
      # Store the base64-encoded keystore as the repository secret DEBUG_KEYSTORE_BASE64.
      - name: Restore persistent debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Missing repository secret DEBUG_KEYSTORE_BASE64. Add the base64-encoded AquaTrack debug keystore in Settings > Secrets and variables > Actions."
            exit 1
          fi

          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Run unit tests and build debug APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: aquatrack-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aquatrack-unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14
