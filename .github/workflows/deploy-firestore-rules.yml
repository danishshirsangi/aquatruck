name: Deploy Firestore Rules

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: Branch containing the Firestore rules to deploy
        required: true
        type: string
        default: feat/multi-tenant-fleet-management
      project_id:
        description: Firebase project ID (not the database ID)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-firestore-rules
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy named Firestore database rules
    runs-on: ubuntu-latest
    steps:
      - name: Check out selected rules branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_branch }}

      - name: Verify deployment target
        shell: bash
        run: |
          set -euo pipefail
          DATABASE_ID="ai-studio-android-aquatrac-ae0f6f83-854d-4712-bbed-b747ec9132c0"
          test -f firebase.json
          test -f firestore.rules
          CONFIGURED_DATABASE="$(node -e "const c=require('./firebase.json'); if (!Array.isArray(c.firestore) || c.firestore.length !== 1) process.exit(2); process.stdout.write(c.firestore[0].database || '')")"
          CONFIGURED_RULES="$(node -e "const c=require('./firebase.json'); process.stdout.write(c.firestore[0].rules || '')")"
          if [ "$CONFIGURED_DATABASE" != "$DATABASE_ID" ] || [ "$CONFIGURED_RULES" != "firestore.rules" ]; then
            echo "firebase.json does not match the approved named database/rules file."
            exit 1
          fi
          echo "DATABASE_ID=$DATABASE_ID" >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy only Firestore rules
        env:
          PROJECT_ID: ${{ inputs.project_id }}
        run: |
          set -euo pipefail
          firebase deploy --only "firestore:$DATABASE_ID" --project "$PROJECT_ID" --non-interactive
